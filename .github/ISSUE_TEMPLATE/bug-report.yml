name: Workbook / Tool Issue
description: Report a reproducible calculation, input, import, compatibility, browser-tool, or documentation problem.
title: '[Bug]: '
body:
- type: markdown
  attributes:
    value: 'Use this form only for a reproducible technical issue. For usage questions or feature suggestions, use
      the [Theseus Workshop Discussions](https://github.com/HyVoid/business-decision-toolbox/discussions) instead.


      Do not post raw Cin7 exports, customer/order details, supplier identifiers, private SKU cost lists, inventory
      valuation reports, credentials, API tokens, or confidential sales data. Use synthetic item IDs, quantities,
      costs, and transaction examples.


      State the Cin7 product/export type, source file or worksheet name (without attaching raw data), relevant column
      headers, synthetic SKU, valuation method, and expected versus actual KPI or exception flag.'
- type: dropdown
  id: problem_area
  attributes:
    label: Which area is affected?
    options:
    - Cin7 Core / DEAR / Omni CSV import mapping
    - SKU normalization / duplicate or unmatched identifiers
    - Sales line profitability / channel fee adjustments
    - Weighted-average cost (WAC) vs. latest purchase cost
    - Stock on hand / Available-to-Promise (ATP) reconciliation
    - Purchase receipt / PO price variance
    - ABC classification / days of supply / dead stock
    - Multi-warehouse stock consolidation
    - Exception report / executive dashboard
    - Excel import / formula issue
    - Compatibility / documentation
    - Other
  validations:
    required: true
- type: dropdown
  id: environment
  attributes:
    label: Where did this happen?
    options:
    - Microsoft Excel for Windows
    - Microsoft Excel for Mac
    - Excel for the web
    - Free browser application / calculator
    - Google Sheets preview
    - Other / not sure
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Excel version, browser, or tool version
    description: Optional. Include the Excel build or browser/version and the date tested, if known.
    placeholder: Microsoft 365 desktop / Excel 2024 / browser and test date
  validations:
    required: false
- type: textarea
  id: summary
  attributes:
    label: What happened?
    description: State the Cin7 product/export type, source file or worksheet name (without attaching raw data),
      relevant column headers, synthetic SKU, valuation method, and expected versus actual KPI or exception flag.
    placeholder: When I enter the synthetic example...
  validations:
    required: true
- type: textarea
  id: expected_result
  attributes:
    label: What did you expect to happen?
    placeholder: I expected the result or status to...
  validations:
    required: true
- type: textarea
  id: actual_result
  attributes:
    label: What happened instead?
    description: Include the displayed output, warning, error message, or unexpected behaviour. Remove all confidential
      information.
    placeholder: Instead, the tool displays...
  validations:
    required: true
- type: textarea
  id: reproduction_steps
  attributes:
    label: Steps to reproduce
    description: List the smallest repeatable sequence. Include the worksheet, page, or calculation stage if applicable.
    placeholder: '1. Open the workbook or browser tool...

      2. Enter synthetic sample values...

      3. Review the affected output...'
  validations:
    required: false
- type: textarea
  id: safe_example
  attributes:
    label: Synthetic example / affected cell or field
    description: Optional. Include fictitious identifiers, values, units, dates, or column names. Do not attach
      original source files.
    placeholder: 'Synthetic ID: ... | Input: ... | Expected: ... | Actual: ...'
  validations:
    required: false
- type: checkboxes
  id: privacy_check
  attributes:
    label: Public issue and data-safety confirmation
    options:
    - label: I have used synthetic or properly anonymized examples and removed personal identifiers, customer or
        supplier data, confidential commercial or engineering information, financial records, credentials, and other
        sensitive details.
      required: true
    - label: I understand this is a public GitHub issue, not a private support channel.
      required: true
